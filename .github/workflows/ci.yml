name: CI

on:
  push:
    branches: [canary, dev, beta, main]
  pull_request:

jobs:
  build:
    name: Kotlin/JS + build tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
